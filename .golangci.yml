version: "2"
run:
  relative-path-mode: gomod
  modules-download-mode: readonly
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    dupl:
      threshold: 200
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - noctx
        path: _test\.go
        text: httptest.NewRequest
      - linters:
          - misspell
        text: '`thn` is a misspelling of `then`'
      - linters:
          - gosec
        path: pkg/messages/message.go
        text: 'G101: Potential hardcoded credentials'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
